name: Rust Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --version 1.4.2 --locked
      - name: Test Rust protocol
        run: cargo test -p goblin-core
        working-directory: rust
      - name: Build installable Rust APK
        run: cargo apk2 build -p mobile-goblin --target aarch64-linux-android --lib
        working-directory: rust
      - name: Upload Mobile Goblin APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-goblin-rust-apk
          path: rust/target/**/*.apk
          if-no-files-found: error

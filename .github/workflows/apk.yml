name: Rust Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-goblin-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent Android signing key
        env:
          MOBILE_GOBLIN_KEYSTORE_BASE64: ${{ secrets.MOBILE_GOBLIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$MOBILE_GOBLIN_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$MOBILE_GOBLIN_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --version 1.4.2 --locked
      - name: Test Rust protocol
        run: cargo test -p goblin-core
        working-directory: rust
      - name: Build installable Rust APK
        run: cargo apk2 build -p mobile-goblin --target aarch64-linux-android --lib
        working-directory: rust
      - name: Align, sign, and verify Android APK
        run: |
          apk_path="$(find rust/target -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/zipalign" -P 16 -f 4 "$apk_path" "$RUNNER_TEMP/Mobile-Goblin-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/Mobile-Goblin.apk" \
            "$RUNNER_TEMP/Mobile-Goblin-aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Mobile-Goblin.apk"
          "$build_tools/zipalign" -c -P 16 4 "$RUNNER_TEMP/Mobile-Goblin.apk"
      - name: Upload Mobile Goblin APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-goblin-rust-apk
          path: ${{ runner.temp }}/Mobile-Goblin.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s "$RUNNER_TEMP/Mobile-Goblin.apk"
          gh release create "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/Mobile-Goblin.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mobile Goblin Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Download Mobile-Goblin.apk on your Android phone and open it to install. Android 8.0 or newer is required. This is a debug-signed development build." \
            --latest

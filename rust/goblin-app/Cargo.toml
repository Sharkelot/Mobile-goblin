[package]
name = "mobile-goblin"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
goblin-core = { path = "../goblin-core" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "std", "backend-android-activity-06", "backend-winit", "renderer-femtovg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
http = "1"

[build-dependencies]
slint-build = "=1.18.1"

[package.metadata.android]
package = "com.sharkelot.mobilegoblin"
resources = "resources"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Mobile Goblin"
icon = "@mipmap/ic_launcher"
uses_cleartext_traffic = true

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

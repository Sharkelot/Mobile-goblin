[package]
name = "goblin-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust Hermes dashboard client for Mobile Goblin"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
